cd D:\jsjxm\A-AI-BACKEND

# 创建简单的HTML文件
@'
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能摄像头管理系统</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .btn { background: #007bff; color: white; padding: 10px; margin: 5px; border: none; cursor: pointer; }
        .result { background: #f8f9fa; padding: 15px; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>📹 智能摄像头管理系统</h1>
    <p>服务器已启动: http://localhost:8000</p>
    
    <button class="btn" onclick="window.open('http://localhost:8000/docs')">API文档</button>
    <button class="btn" onclick="test()">测试连接</button>
    
    <div id="result" class="result"></div>
    
    <script>
        async function test() {
            try {
                const res = await fetch('http://localhost:8000/health');
                const data = await res.json();
                document.getElementById('result').innerHTML = JSON.stringify(data, null, 2);
            } catch(e) {
                document.getElementById('result').innerHTML = '错误: ' + e.message;
            }
        }
    </script>
</body>
</html>
'@ | Out-File -FilePath "admin.html" -Encoding UTF8

echo "✅ HTML文件已创建: admin.html"
